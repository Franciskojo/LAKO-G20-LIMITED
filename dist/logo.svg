<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="g20Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- LAKO text -->
  <text x="10" y="85" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="2">
    LAKO
  </text>
  
  <!-- G20 Badge / Symbol -->
  <g transform="translate(240, 15)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="135" height="85" rx="14" fill="url(#g20Grad)" filter="url(#glow)"/>
    <rect x="3" y="3" width="129" height="79" rx="11" fill="#0d131f" stroke="url(#g20Grad)" stroke-width="2"/>
    
    <!-- G20 Text inside Badge -->
    <text x="67" y="62" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="52" fill="url(#g20Grad)" text-anchor="middle" letter-spacing="1">
      G20
    </text>
  </g>

  <!-- LIMITED Tag -->
  <text x="390" y="82" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="#dc2626" letter-spacing="4">
    LIMITED
  </text>

  <!-- Bottom Accent Line -->
  <rect x="10" y="102" width="470" height="4" rx="2" fill="url(#g20Grad)" opacity="0.85"/>
</svg>
